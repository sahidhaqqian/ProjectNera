[package]
name = "nera"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.19", default-features = false, features = [
    "default_app",
    "std",
    "bevy_winit",
    "3d_bevy_render",
    "jpeg",
    "png",
    "bevy_audio",
    "mp3",
    "bevy_settings",
    "ui_bevy_render",
    "bevy_ui_widgets",
    "bevy_picking",
    "ui_picking",
    "default_font",
] }

bevy_vrm1 = "0.9.2"

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6.2"

windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_UI_Shell",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }

# ============================================================
# DEVELOPMENT
# Prioritas: edit -> compile -> run secepat mungkin
# ============================================================

[profile.dev]
opt-level = 0
debug = 0
incremental = true
codegen-units = 256
lto = "off"

[profile.dev.package."*"]
opt-level = 1
debug = false
codegen-units = 256

[profile.dev.build-override]
opt-level = 0
debug = false
codegen-units = 256

# ============================================================
# RELEASE
# Prioritas: runtime performance + binary optimization
# ============================================================

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = "symbols"
panic = "abort"
