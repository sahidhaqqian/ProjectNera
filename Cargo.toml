[package]
name = "nera"
version = "0.1.0"
edition = "2024"

[dependencies]
# Bevy ditekan ke batas minimum absolut. UI, Audio, dan Gamepad tidak akan dimuat.
bevy = { version = "0.19", default-features = false, features = [
    "default_app",
    "std",
    "bevy_winit",
    "3d_bevy_render",
    "jpeg",
    "png", # Wajib untuk transparansi rambut/baju di VRM
] }

bevy_vrm1 = "0.9.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = true           # 'true' (fat LTO) memotong dead code jauh lebih agresif dibanding 'thin'
codegen-units = 1
strip = "symbols"
panic = "abort"