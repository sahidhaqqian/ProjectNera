[package]
name = "nera"
version = "0.1.0"
edition = "2024"
default-run = "nera"
description = "Project Nera - Windows desktop companion"
authors = ["Sahid Haqqi"]
license-file = "LICENSE"

[build-dependencies]
winresource = "0.1"

[dependencies]
bevy = { version = "0.19", default-features = false, features = [
    "default_app",
    "std",
    "bevy_winit",
    "3d_bevy_render",
    "jpeg",
    "png",
    "bevy_audio",
    "mp3",
    "wav",
    "vorbis",
    "bevy_settings",
    "ui_bevy_render",
    "bevy_ui_widgets",
    "bevy_picking",
    "ui_picking",
    "default_font",
] }

bevy_vrm1 = "0.9.2"
bevy_framepace = { version = "0.22", default-features = false }
# Already used by Bevy; access its bounded decoder for embedded thumbnails.
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
# Already transitive through Bevy; stable streamed character fingerprints.
blake3 = "1"
# Use Bevy's existing decoder to reject invalid alarm imports before playback.
rodio = { version = "0.22.2", default-features = false }

[dev-dependencies]
# The native editor already uses this crate; initialize its headless test buffer.
bevy_clipboard = { version = "0.19", default-features = false }

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6.2"

windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_UI_Shell",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
    "Media_Control",
    "Foundation_Collections",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_WinRT",
    "Win32_System_Threading",
] }

# ============================================================
# DEVELOPMENT
# Prioritas: edit -> compile -> run secepat mungkin
# ============================================================

[profile.dev]
opt-level = 0
debug = 0
incremental = true
codegen-units = 256
lto = "off"

[profile.dev.package."*"]
opt-level = 1
debug = false
codegen-units = 256

[profile.dev.build-override]
opt-level = 0
debug = false
codegen-units = 256

# ============================================================
# RELEASE
# Prioritas: runtime performance + binary optimization
# ============================================================

[profile.release]
opt-level = 3
# Full LTO's single whole-engine optimization exceeded practical headroom on
# the audited 8 GiB Windows host. Thin LTO retains cross-crate optimization.
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

# The application and opt-in audit binaries contain many ECS monomorphizations.
# Partition this package's code generation; dependencies retain their profile.
[profile.release.package.nera]
codegen-units = 8
