name: Validate and package Nera Windows

on:
  push:
    branches: [main, codex/animation-manager-redesign]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    env:
      RUSTC_WRAPPER: ''
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER: link.exe
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - name: Install tested Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt
          rustup default 1.98.0
          rustc --version
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-release-1.98
      - run: cargo fmt --check
      - run: cargo check --locked
      - run: cargo test --locked
      - run: cargo build --release --locked
      - name: Refresh third-party dependency notices
        shell: pwsh
        run: |
          cargo metadata --locked --format-version 1 | Set-Content -Encoding utf8 metadata.json
          python tools/generate_dependency_notices.py metadata.json
      - name: Verify GUI executable and package runtime
        shell: pwsh
        run: |
          $pe = python tools/inspect_pe.py target/release/nera.exe | ConvertFrom-Json
          if ($pe.subsystem -ne 2) { throw 'Release executable must use Windows GUI subsystem.' }
          ./tools/package_windows.ps1 -OutputRoot target/distribution
      - uses: actions/upload-artifact@v7
        with:
          name: nera-windows-x64-${{ github.sha }}
          path: |
            target/distribution/*.zip
            target/distribution/*.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
