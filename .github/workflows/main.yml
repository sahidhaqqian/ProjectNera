name: Build Nera Windows

on:
  push:
    branches:
      - main
      - codex/animation-manager-redesign

  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    env:
      RUSTC_WRAPPER: ""
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER: link.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Show Rust version
        run: |
          rustc --version
          cargo --version

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          shared-key: ${{ github.ref_name }}

      - name: Build debug
        if: github.ref != 'refs/heads/main'
        run: cargo build

      - name: Build release
        if: github.ref == 'refs/heads/main'
        run: cargo build --release

      - name: Upload debug executable
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: nera-windows-debug-${{ github.sha }}
          path: target/debug/nera.exe
          retention-days: 3
          compression-level: 0

      - name: Upload release executable
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: nera-windows-release-${{ github.sha }}
          path: target/release/nera.exe
          retention-days: 7
          compression-level: 0
