name: Build Nera Windows

on:
  push:
    branches:
      - main
      - codex/animation-manager-redesign

  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    env:
      RUSTC_WRAPPER: ""
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER: link.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Show Rust version
        run: |
          rustc --version
          cargo --version

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          shared-key: ${{ github.ref_name }}

      - name: Build debug
        if: github.ref != 'refs/heads/main'
        run: cargo build

      - name: Build release
        if: github.ref == 'refs/heads/main'
        run: cargo build --release

      - name: Package executable and runtime assets
        id: package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $buildProfile = if ($env:GITHUB_REF -eq 'refs/heads/main') { 'release' } else { 'debug' }
          $packagePath = Join-Path $env:RUNNER_TEMP 'nera-package'
          New-Item -ItemType Directory -Path $packagePath -Force | Out-Null
          Copy-Item -LiteralPath "target/$buildProfile/nera.exe" -Destination (Join-Path $packagePath 'nera.exe')

          # Copy repository assets only, preserving assets/... beside nera.exe.
          # Local, gitignored animation collections are not part of the release.
          $assetPaths = @(git -c core.quotepath=false ls-files -- assets)
          if ($LASTEXITCODE -ne 0) { throw 'Could not list tracked runtime assets.' }
          foreach ($assetPath in $assetPaths) {
            $destination = Join-Path $packagePath $assetPath
            New-Item -ItemType Directory -Path (Split-Path -Parent $destination) -Force | Out-Null
            Copy-Item -LiteralPath $assetPath -Destination $destination
          }

          $requiredAssets = @('vrm/nera_256.vrm', 'sound/alarm.mp3', 'shaders/nera_shadow_only.wgsl')
          foreach ($source in @('src/animation/playback.rs', 'src/alarm.rs')) {
            foreach ($match in [regex]::Matches([IO.File]::ReadAllText($source), '"(animations/animasi_basic/[^"\r\n]+)"')) {
              $requiredAssets += $match.Groups[1].Value
            }
          }
          foreach ($asset in ($requiredAssets | Sort-Object -Unique)) {
            $file = Join-Path $packagePath "assets/$asset"
            if (!(Test-Path -LiteralPath $file -PathType Leaf) -or (Get-Item -LiteralPath $file).Length -eq 0) {
              throw "Required runtime asset missing from package: $asset. Make sure it is committed to Git."
            }
          }

          @'
          Extract this entire ZIP before running Nera.
          Keep nera.exe and the assets folder together in the same directory.
          Run nera.exe from the extracted folder, not from inside the ZIP.
          '@ | Set-Content -LiteralPath (Join-Path $packagePath 'START-HERE.txt') -Encoding utf8
          "path=$packagePath" >> $env:GITHUB_OUTPUT

      - name: Upload debug package
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: nera-windows-debug-${{ github.sha }}
          path: ${{ steps.package.outputs.path }}
          if-no-files-found: error
          retention-days: 3
          compression-level: 6

      - name: Upload release package
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: nera-windows-release-${{ github.sha }}
          path: ${{ steps.package.outputs.path }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
